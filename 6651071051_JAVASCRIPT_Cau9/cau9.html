<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Form Validation Exercise</title>
<link rel="stylesheet" href="Styles/cau9.css">
</head>
<body>
<form id="regForm" novalidate>
<h3>Personal Information</h3>
<table>
<tr><td>Enter name*:</td><td><input type="text" id="name"></td><td class="err" id="e-name"></td></tr>
<tr><td>Sex*:</td><td><label><input type="radio" name="sex" value="Male"> Male</label>
  <label><input type="radio" name="sex" value="Female"> Female</label></td><td class="err" id="e-sex"></td></tr>
<tr><td>Enter email address*:</td><td><input type="text" id="email"></td><td class="err" id="e-email"></td></tr>
<tr><td>Enter birthday (MM/DD/YYYY)*:</td><td><input type="text" id="birthday"></td><td class="err" id="e-birthday"></td></tr>
<tr><td>Enter street address (line 1)*:</td><td><input type="text" id="street"></td><td class="err" id="e-street"></td></tr>
<tr><td>Enter city*:</td><td><input type="text" id="city"></td><td class="err" id="e-city"></td></tr>
<tr><td>Select a region*:</td><td><select id="region">
  <option value="">-- Select --</option>
  <option>North</option><option>Central</option><option>South</option></select></td><td class="err" id="e-region"></td></tr>
<tr><td>Enter 5-digit ZIP code*:</td><td><input type="text" id="zip" maxlength="5"></td><td class="err" id="e-zip"></td></tr>
<tr><td></td><td><button type="button" id="btnFinish">Finish</button>
  <button type="button" id="btnClear">Clear</button></td><td></td></tr>
</table>
</form>
<script src="Scripts/jquery-3.6.0.min.js"></script>
<script src="Scripts/cau9.js"></script>
</body>
</html>
